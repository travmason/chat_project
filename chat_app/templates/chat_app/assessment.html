<!-- chat_app/templates/chat_app/assessment.html -->

{% extends 'base.html' %}

{% block content %}
<div class="container p-5">
<h2>Assessment</h2>
{% if assessment %}
    <p>{{ assessment.assessment_text|safe }}</p>
{% else %}
    <p>The assessment is not yet available. Please check back later.</p>
{% endif %}
<a href="{% url 'student_dashboard' %}" class="btn btn-secondary mt-3">Back to Dashboard</a>
<a href="{% url 'reassess_conversation' assessment.conversation_id %}" class="btn btn-secondary mt-3">Re-Assess</a>

</div>
{% endblock %}
