{% extends 'base.html' %}

{% block content %}
<h2>Unassign Scenario</h2>
<p>Are you sure you want to unassign the scenario "{{ assignment.scenario.title }}" from student "{{ assignment.student.user.email }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirm Unassign</button>
    <a href="{% url 'teacher_dashboard' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
