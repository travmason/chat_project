<!-- chat_app/templates/chat_app/signup.html -->

{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% load socialaccount %}

{% block title %}Sign Up{% endblock %}
{% block content %}
<section class="vh-50">
    <div class="container py-5 h-100">
      <div class="row d-flex align-items-center justify-content-center h-100">
        <div class="col-md-8 col-lg-7 col-xl-6">
          <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-login-form/draw2.svg"
            class="img-fluid" alt="Phone image">
            <p>Also a check to see that the site is actually working</p>
        </div>
        <div class="col-md-7 col-lg-5 col-xl-5 offset-xl-1">
            <h2>Sign Up</h2>
            <p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
            <div class="separator">or</div>
            <div class="container d-flex justify-content-between align-items-center">
              <div id="g_id_onload"
                  data-client_id="175365173077-egetlbpsevua120elt1pm2oc47dtgk2q.apps.googleusercontent.com"
                  data-context="signin"
                  data-ux_mode="popup"
                  data-login_uri="https://rolegenie.com.au/accounts/google/login/"
                  data-auto_select="true"
                  data-itp_support="true">
              </div>

              <div class="g_id_signin"
                  data-type="standard"
                  data-shape="pill"
                  data-theme="outline"
                  data-text="signup_with"
                  data-size="large"
                  data-logo_alignment="center"
                  data-width="400">
              </div>
            </div>
            <div class="separator">or</div>
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-primary">Sign Up</button>
            </form>
        </div>

        <!-- <a href="{% provider_login_url 'google' %}">Login with Google</a> -->
      </div>
    </div>
  </section>
{% endblock %}
