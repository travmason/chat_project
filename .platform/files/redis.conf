# redis.conf for Amazon Linux 2023 on Elastic Beanstalk
# Managed via .platform hooks. Do NOT put secrets here.

# Bind only to loopback; this is for single-instance/local caching use
bind 127.0.0.1 ::1
protected-mode yes
port 6379

# Let systemd manage the process
supervised systemd
daemonize no

# Directories & logging
dir /var/lib/redis
logfile /var/log/redis/redis-server.log

# Durability (good default for small workloads; adjust as needed)
appendonly yes
appendfsync everysec
stop-writes-on-bgsave-error no

# Keep some RDB snapshots for quicker cold restores (optional)
save 900 1
save 300 10
save 60 10000

# Memory guardrails — tune for your instance size
maxmemory 256mb
maxmemory-policy allkeys-lru

# Authentication will be injected at deploy if REDIS_PASSWORD is set:
# requirepass <appended by hook 30-apply-redis-password.sh>
